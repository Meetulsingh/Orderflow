# Full local stack with real infrastructure (PostgreSQL, RabbitMQ, Redis) for machines with Docker.
#   docker compose up --build
#   Frontend: cd frontend && npm start  → http://localhost:4200
#   Gateway:  http://localhost:5000      RabbitMQ UI: http://localhost:15672 (guest/guest)
#
# No Docker? See scripts/run-local.ps1 — it runs everything against a plain local PostgreSQL.

x-service: &service
  restart: unless-stopped
  environment: &env
    ASPNETCORE_ENVIRONMENT: Development
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/orderflow
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    REDIS_URL: redis://redis:6379
    JWT_SECRET: local-docker-compose-signing-key-0123456789abcdef
    PORT: "8080"
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderflow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  identity:
    <<: *service
    build: { context: ., dockerfile: src/Services/Identity/OrderFlow.Identity.API/Dockerfile }

  catalog:
    <<: *service
    build: { context: ., dockerfile: src/Services/Catalog/OrderFlow.Catalog.API/Dockerfile }

  ordering:
    <<: *service
    build: { context: ., dockerfile: src/Services/Ordering/OrderFlow.Ordering.API/Dockerfile }
    environment:
      <<: *env
      Services__Catalog: http://catalog:8080

  payment:
    <<: *service
    build: { context: ., dockerfile: src/Services/Payment/OrderFlow.Payment.Worker/Dockerfile }

  notification:
    <<: *service
    build: { context: ., dockerfile: src/Services/Notification/OrderFlow.Notification.Worker/Dockerfile }

  gateway:
    <<: *service
    build: { context: ., dockerfile: src/Gateway/OrderFlow.Gateway/Dockerfile }
    ports: ["5000:8080"]
    environment:
      <<: *env
      Services__Identity: http://identity:8080
      Services__Catalog: http://catalog:8080
      Services__Ordering: http://ordering:8080
      Services__Payment: http://payment:8080
      Services__Notification: http://notification:8080
      CORS_ORIGINS: http://localhost:4200
    depends_on: [identity, catalog, ordering, payment, notification]
