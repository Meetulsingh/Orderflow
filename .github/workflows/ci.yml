name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orderflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore
        run: dotnet restore OrderFlow.slnx
      - name: Build
        run: dotnet build OrderFlow.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test OrderFlow.slnx -c Release --no-build --verbosity normal
      - name: Start services
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          start() { nohup dotnet run --no-build -c Release --project "$1" --launch-profile http > "/tmp/$(basename $1).log" 2>&1 & }
          start src/Services/Identity/OrderFlow.Identity.API
          start src/Services/Catalog/OrderFlow.Catalog.API
          start src/Services/Ordering/OrderFlow.Ordering.API
          start src/Services/Payment/OrderFlow.Payment.Worker
          start src/Services/Notification/OrderFlow.Notification.Worker
          start src/Gateway/OrderFlow.Gateway
          sleep 30
      - name: End-to-end smoke test
        run: node scripts/smoke-test.mjs http://localhost:5000
      - name: Service logs
        if: failure()
        run: tail -n 80 /tmp/*.log

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
